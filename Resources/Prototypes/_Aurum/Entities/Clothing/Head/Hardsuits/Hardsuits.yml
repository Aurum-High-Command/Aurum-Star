- type: entity
  parent: ClothingHeadHardsuitBase
  id: ClothingHelmetHardsuitOneStarUnitEngineering
  name: OS-001E "Sequence" helm
  description: A space suit like helmet for the OS-001E "Sequence" hardsuit, it's a popular rumor that these helmets were designed to not be see-through so officers didn't have to look at the corpses inside the suits when things went downhill.
  components:
  - type: Sprite
    sprite: _Aurum/Clothing/Head/Hardsuits/one_star_hardsuit.rsi
  - type: Clothing
    sprite: _Aurum/Clothing/Head/Hardsuits/one_star_hardsuit.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
  - type: FlashImmunity
  - type: NightVision # Gen 1 monotube
    relayOverlay: true
    goggleEffect: true
    action: ActionToggleNightVision
    viewCircleRadius: 400
    viewCircleCount: 1
    viewCircleSpacing: 280
    phosphorColor: "#00FF00"
    lightingColor: "#FFFFFF32"
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
