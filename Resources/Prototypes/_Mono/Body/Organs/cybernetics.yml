- type: entity
  parent: BaseItem
  id: OrganInternalAirSystem
  name: SHI LS-210 IAS # Aurum - Switching PDV for another corp i'll expand on later
  description: A cybernetic organ that replaces the lungs with a suite of filters and other devices. Not enough to keep you breathing in space, but filters out toxic gases and makes you need a little less to breathe.
  components:
  - type: EmitSoundOnPickup
    sound:
      collection: OrganInteraction
  - type: EmitSoundOnDrop
    sound:
      collection: OrganInteraction
  - type: EmitSoundOnLand
    sound:
      collection: OrganInteraction
  - type: Organ
    slotId: lungs
  - type: Gibbable
  - type: Cybernetics
  - type: Sprite
    sprite: _Mono/Objects/Misc/cybernetics.rsi
    state: internal_air_system
  - type: Lung
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: "Lung"
    metabolizerTypes: [ IAS ]
    groups:
    - id: Gas
      rateModifier: 60.0
  - type: SolutionContainerManager
    solutions:
      Lung:
        maxVol: 100.0
        canReact: false

- type: entity
  parent: BaseItem
  id: OrganPDVAdvancedHeart
  name: SHI VV/KE prosthetic heart # Aurum - Switching PDV for another corp i'll expand on later
  description: A fast-pumping compact artifical heart. Can process a lot of reagents at once, and lets you take more damage before going down, but lowers your stamina and processes medicine slower.
  components:
  - type: EmitSoundOnPickup
    sound:
      collection: OrganInteraction
  - type: EmitSoundOnDrop
    sound:
      collection: OrganInteraction
  - type: EmitSoundOnLand
    sound:
      collection: OrganInteraction
  - type: Organ
    slotId: heart
    onAdd:
    - type: Stamina
      critThreshold: 75 # 25% less stamina
      decay: 2
    - type: WillToLive
      deadIncrease: 30 # Aurum change
    - type: Tenacity # Aurum change - Okay so this would ideally give you 30 more hp and 30 more crit HP
      critIncrease: 30
#    - type: SlowOnDamage - Aurum - THIS SHIT BREAKS.
#      speedModifierThresholds:
#        70: 0.6
#        90: 0.4
  - type: Gibbable
  - type: Cybernetics
  - type: Sprite
    sprite: _Mono/Objects/Misc/cybernetics.rsi
    state: glare_dampeners
  - type: Heart
  - type: Metabolizer
    maxReagents: 6
    metabolizerTypes: [Human]
    groups:
    - id: Medicine
      rateModifier: 1.2
    - id: Cryogenic
      rateModifier: 1.2
    - id: Poison
      rateModifier: 0.2
    - id: Narcotic
      rateModifier: 0.2
  - type: Item
    size: Small
