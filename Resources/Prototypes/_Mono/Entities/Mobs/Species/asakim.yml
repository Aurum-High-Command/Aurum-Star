- type: damageModifierSet
  id: GenemoddedScale # Strong brute-focused scales.
  coefficients:
    Cold: 1 # Aurum 1.2 -> 1
    Radiation: 1.4 # Aurum 1.2 -> 1.4 - Half-machine half-organic organisms that get fucked over by radiation.
    Poison: 1.2
    Piercing: 0.9 # Aurum 0.8 -> 0.9
    Slash: 0.8 # Aurum 0.75 -> 0.8
    Blunt: 0.8 # Aurum 0.75 -> 0.8
    Heat: 1.2 # Aurum 1.1 -> 1.2 - These are a half-machine, they should struggle with heat slightly.
    Shock: 1.5 # Aurum 1.1 -> 1.5
