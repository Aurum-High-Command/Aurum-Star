# TSF

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonSandevistanTSF
  name: TSF autosurgeon (WJY-21X sandevistan)
  description: Replaces the heart with a inferior version of the Cybersun Sandevistan. Doesn't cool down as fast as the real thing. # Aurum - Lore changes.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    targetOrgan: Heart
    newPartProto: OrganHeartTSFSandevistan

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonSandevistanTSFFlatpack
  name: TSF autosurgeon (WJY-21X sandevistan) flatpack
  description: A flatpack used for constructing a TSF autosurgeon.
  components:
  - type: Flatpack
    entity: AutosurgeonSandevistanTSF
  - type: StaticPrice
    price: 15000
  - type: Sprite
    layers:
    - state: medical_lathe

