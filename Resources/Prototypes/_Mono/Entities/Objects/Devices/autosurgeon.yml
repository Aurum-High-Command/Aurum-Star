# General autosurgeons

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonIASSHI
  name: SHI autosurgeon (LS-210 IAS) # Aurum - Lore changes.
  description: Replaces the lungs with an advanced internal-air-system. Capable of filtering out most atmos gases and increasing respiratory efficiency greatly.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    targetOrgan: Lungs
    newPartProto: OrganInternalAirSystem

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonIASnSHIFlatpack
  name: SHI autosurgeon (LS-210 IAS) flatpack # Aurum - Lore changes.
  description: A flatpack used for constructing a SHI autosurgeon.
  components:
  - type: Flatpack
    entity: AutosurgeonIASSHI
  - type: StaticPrice
    price: 4000
  - type: Sprite
    layers:
    - state: medical_lathe


# Dermal armor

- type: entity
  parent: BaseAutosurgeonMieyo
  id: AutosurgeonDermalArmorSAG
  name: SAG autosurgeon (E-SAPI dermal armor) # Aurum - Lore changes.
  description: Implants an array of E-SAPI dermal armor plates into the body. Makes you more vulnerable to heat and shock, but makes you more resistant to bullets.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    componentsToUser:
    - type: DamageProtectionBuff
      modifiers:
        dermal:
          id: DermalArmorCybernetics
          coefficients:
            Shock: 1.25
            Heat: 1.1
            Piercing: 0.85
            Blunt: 0.9
            Slash: 0.9

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonDermalArmorSAGFlatpack
  name: SAG autosurgeon (E-SAPI dermal armor) flatpack # Aurum - Lore changes.
  description: A flatpack used for constructing a Scarborough Arms Guild autosurgeon. # Aurum - Lore changes.
  components:
  - type: Flatpack
    entity: AutosurgeonDermalArmorSAG
  - type: StaticPrice
    price: 2500
  - type: Sprite
    layers:
    - state: medical_lathe

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonAdvHeartSHI
  name: SHI autosurgeon (VV/KE prosthetic heart)
  description: Replaces the heart with a more powerful one. Lets you process reagents faster and take more damage before going down, but lowers your stamina and processes medicine slower.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    targetOrgan: Heart
    newPartProto: OrganPDVAdvancedHeart

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonAdvHeartSHIFlatpack
  name: SHI autosurgeon (VV/KE prosthetic heart) flatpack
  description: A flatpack used for constructing a SHI autosurgeon. # Aurum - Lore changes.
  components:
  - type: Flatpack
    entity: AutosurgeonAdvHeartSHI
  - type: StaticPrice
    price: 3000
  - type: Sprite
    layers:
    - state: medical_lathe

