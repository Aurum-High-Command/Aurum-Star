- type: entity
  id: NFCrateSalvageAssortedGoodies
  suffix: Filled, Salvage Random
  categories: [ HideSpawnMenu ]
  parent: CrateGenericSteel
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: NFSalvageAssortedGoodies
        rolls: !type:RangeNumberSelector
          range: -1, 3 # -1 used because of strange counting, actual values: [0, 1, 2, 3], ~25% chance of each.

- type: entityTable
  id: NFSalvageAssortedGoodies
  table: !type:GroupSelector
    children:
    # Mats
    #MONO CHANGES (Uncommented weights *10 for digit brevity)
    - id: SheetSteel
      weight: 2 # Aurum
    - id: SheetGlass
      weight: 2 # Aurum
    - id: SheetPlasma
      weight: 1.2 # Aurum
    - id: IngotGold
      weight: 0.8 # Aurum
    - id: IngotSilver
      weight: 1.2 # Aurum
    - id: SheetPlastic
      weight: 1.5 # Aurum
    - id: SheetUranium
      weight: 0.5 # Aurum
    - id: SheetPlasteel
      weight: 0.3 # Aurum - Craft it yourself chud
    - id: MaterialWoodPlank
      weight: 1.8 # Aurum
    - id: MaterialCloth
      weight: 1.6 # Aurum
    - id: MaterialDurathread
      weight: 0.3 #Aurum - From 0.1 to 0.3
    - id: MaterialCardboard
      weight: 0.1
    - id: SheetPaper
      weight: 0.1
    - id: SheetBrass
      weight: 0.1
    - id: MaterialBananium
      weight: 0.06 #0.00001 >> 0.06
    - id: MaterialDiamond5 # MaterialDiamond >> MaterialDiamond5
      weight: 0.02 #0.0000001 >> 0.02
    - id: MaterialBluespace
      weight: 0.02 #0.00000001 Yes they meant it >> 0.02
      # Disk
    # Aurum changes start - this is honestly just small boosts to research because artifacts are kinda sucky rn, we wanna have xenoarch at some point ideally.
    - id: ResearchDisk5000
      weight: 0.4
    - id: ResearchDisk10000
      weight: 0.3
    # Aurum changes end
    - id: ResearchDisk35000
      weight: 0.1 #0.001 >> 0.1
    - id: ResearchDisk65000
      weight: 0.05 #0.0005 >> 0.5
    #END MONO CHANGES

- type: entity
  id: NFCrateSalvageAssortedGoodiesPlastic
  categories: [ HideSpawnMenu ]
  parent: [ CratePlastic, NFCrateSalvageAssortedGoodies ]

- type: entity
  id: NFCrateSalvageAssortedGoodiesTrashCart
  categories: [ HideSpawnMenu ]
  parent: [ CrateTrashCart, NFCrateSalvageAssortedGoodies ]
