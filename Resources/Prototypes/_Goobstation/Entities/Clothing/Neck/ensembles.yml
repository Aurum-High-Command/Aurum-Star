  id: ClothingNeckEnsembleCaptain
  name: blue-gold ensemble # Aurum
  description: You're a hardened veteran, and you rule this ship with an iron fist. That asteroid crash? Never happened. # Aurum
#  suffix: DO NOT MAP - Aurum - Uhhhh we dont have a bijillion hours role timer gate sir
  components:
  - type: Item
    size: Small
    heldPrefix: both
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Sprite
    sprite: _Goobstation/Clothing/Neck/Ensembles/cap.rsi
