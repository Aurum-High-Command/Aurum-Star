  id: ClothingModsuitHeadOfSecurity
  name: SHI-NT "Bulwark" modsuit control unit # Aurum - Lore changes
  description: A modsuit control unit that was once reserved for important security figures back in the pre-war days. Like the "Soldat" modular suit, the model became public after Nanotrasen went semi-bankrupt after the war. # Aurum - Lore changes
  components:
