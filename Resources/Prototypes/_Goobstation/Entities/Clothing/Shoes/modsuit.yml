# Mono - modsuits cleanup - see #3733
- type: entity
  abstract: true
  parent: ClothingShoesBase
  id: ClothingModsuitBootsBase
  name: modsuit boots
  description: A special modular suit boots designed for compact folding inside modular suit control.
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Goobstation/Clothing/Shoes/Modsuits/standard.rsi
    layers:
    - state: boots
    - state: boots-sealed
      map: [ "sealed" ]
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: [ feet ]
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-boots
    sealDownPopup: sealable-clothing-seal-down-boots
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: ItemToggle
    onUse: false
    onActivate: false
  - type: ToggleClothing
    action: ActionToggleMagboots
  - type: ComponentToggler
    components:
    - type: NoSlip
  - type: Magboots
    enabledPrefix: null
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      shoes:
      - state: equipped-FEET-sealed

- type: entity
  parent: ClothingModsuitBootsBase
  id: ClothingModsuitBootsStandard
  name: standard modsuit boots
  description: A special modular suit boots designed for compact folding inside modular suit control.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Shoes/Modsuits/standard.rsi
  - type: FootstepModifier # Aurum Addition
    footstepSoundCollection:
      collection: FootstepHardsuitLight

- type: entity
  parent: ClothingModsuitBootsBase
  id: ClothingModsuitBootsSecurity
  name: SHI-NT "Soldat" modsuit boots # Aurum - Lore changes
  description: Designed to stomp any threats that may be present, sadly it doesn't instantly kill them unlike common belief may imply. # Aurum - Lore changes
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Shoes/Modsuits/security.rsi
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      shoes:
      - state: equipped-FEET-sealed
      shoes-vox:
      - state: equipped-FEET-sealed-vox
  - type: ClothingSlowOnDamageModifier # Mono
    modifier: 0.75
  - type: FootstepModifier # Aurum Addition
    footstepSoundCollection:
      collection: FootstepHardsuitMedium

- type: entity
  parent: ClothingModsuitBootsBase
